services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: agentos
      POSTGRES_DB: agentos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nats:
    image: nats:2.10
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  api:
    build: .
    environment:
      AGENTOS_DATABASE_URL: postgresql+asyncpg://agentos:agentos@postgres:5432/agentos
      AGENTOS_NATS_URL: nats://nats:4222
      AGENTOS_LOG_LEVEL: INFO
      AGENTOS_BOOTSTRAP_API_KEY: local-dev-key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

  worker:
    build: .
    command: ["python", "-m", "agentos.worker"]
    environment:
      AGENTOS_DATABASE_URL: postgresql+asyncpg://agentos:agentos@postgres:5432/agentos
      AGENTOS_NATS_URL: nats://nats:4222
      AGENTOS_WORKER_ID: worker-1
      AGENTOS_LEASE_SECONDS: 30
      AGENTOS_HEARTBEAT_SECONDS: 5
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  nats_data:
